## Use file-based H2 so seed data persists between restarts during development.
## The database files will be created under the backend working directory (./data/).
spring.datasource.url=jdbc:h2:file:./data/gourmet;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Ensure Hibernate dialect when JDBC metadata isn't available during some run profiles
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT config (base64 key). For dev only. You should set a secure random secret in production via env var.
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.expiration-ms=3600000

# server port for backend
server.port=8080
# Enable debug logs for Spring Security to inspect access decisions during development
logging.level.org.springframework.security=DEBUG

# Expose actuator health/info endpoints during development
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
